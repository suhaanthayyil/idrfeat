[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idrfeat"
version = "0.1.0"
description = "Feature extraction for intrinsically disordered regions, for fitness and variant-effect modeling"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Suhaan Thayyil" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=15,<22",
    "pyyaml>=6,<7",
]

# Optional, heavier scientific tools. The core library computes every sequence-based
# feature without these. Annotation, disorder-predictor, and conservation features turn
# on when the matching extra is installed and its database or model is available.
[project.optional-dependencies]
predictors = [
    "metapredict>=3,<4",
    "localcider>=0.1.21,<0.2",
]
binding = ["aiupred @ git+https://github.com/doszilab/AIUPred"]
conservation = ["pyBigWig>=0.3.22,<0.4"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "black>=24,<26"]

[project.scripts]
idrfeat = "idrfeat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idrfeat"]

[tool.hatch.build.targets.wheel.force-include]
"src/idrfeat/data" = "idrfeat/data"

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
